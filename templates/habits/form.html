{% extends "layout.html" %}
{% block title %}{{ t('habits.edit') if habit else t('habits.new') }}{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="flex items-center gap-2 mb-6">
        <a href="/habits" style="color: var(--text-muted)" class="hover:opacity-70">&larr; {{ t('back') }}</a>
        <h1 class="text-xl font-bold" style="color: var(--text-primary)">{{ t('habits.edit') if habit else t('habits.new') }}</h1>
    </div>

    <div class="glass-card p-6">
        {% if not habit %}
            <form method="post" action="/api/habits" class="space-y-4">
        {% else %}
            <form hx-put="{{ '/api/habits/' ~ habit.id }}"
                  hx-swap="none"
                  hx-on::after-request="if(event.detail.successful && event.detail.elt === this) setTimeout(() => window.location.href='/habits/{{ habit.id }}', 800)"
                  class="space-y-4">
        {% endif %}

            <div>
                <label class="block text-sm font-medium mb-1" style="color: var(--text-primary)">{{ t('form.habit_name') }} *</label>
                <input type="text" name="name" required maxlength="200"
                       value="{{ habit.name if habit else '' }}"
                       class="w-full px-3 py-2 border rounded-lg text-sm outline-none"
                       style="border-color: #e2e8f0; background: rgba(255,255,255,0.5);"
                       placeholder="">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1" style="color: var(--text-primary)">{{ t('habits.icon_label') }}</label>
                <input type="text" name="icon" maxlength="2"
                       value="{{ habit.icon if habit and habit.icon else '' }}"
                       class="w-full px-3 py-2 border rounded-lg text-sm outline-none"
                       style="border-color: #e2e8f0; background: rgba(255,255,255,0.5);"
                       placeholder="{{ t('habits.icon_ph') }}">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1" style="color: var(--text-primary)">{{ t('habits.freq') }}</label>
                <select name="frequency"
                        class="w-full px-3 py-2 border rounded-lg text-sm outline-none"
                        style="border-color: #e2e8f0; background: rgba(255,255,255,0.5);">
                    <option value="daily" {% if habit and habit.frequency == 'daily' %}selected{% endif %}>{{ t('freq.daily') }}</option>
                    <option value="weekly" {% if habit and habit.frequency == 'weekly' %}selected{% endif %}>{{ t('freq.weekly') }}</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1" style="color: var(--text-primary)">{{ t('form.desc_short') }}</label>
                <textarea name="description" rows="2"
                          class="w-full px-3 py-2 border rounded-lg text-sm outline-none resize-none"
                          style="border-color: #e2e8f0; background: rgba(255,255,255,0.5);"
                          placeholder="{{ t('form.habit_desc_ph') }}">{{ habit.description if habit and habit.description else '' }}</textarea>
            </div>

            <div class="flex gap-3 pt-2">
                <button type="submit" class="btn-primary">
                    {{ t('form.save_changes') if habit else t('form.create_habit') }}
                </button>
                <a href="/habits"
                   class="px-4 py-2 rounded-lg text-sm transition-colors"
                   style="background: rgba(0,0,0,0.04); color: var(--text-secondary);">
                    {{ t('cancel') }}
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
