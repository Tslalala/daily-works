<div class="mimg-strip" id="mimg-{{ m.id }}">
    {% for img in m.images %}
    <span class="mimg-item">
        <img class="mimg-thumb" src="/api/milestone-images/{{ img.id }}" alt="" loading="lazy"
             data-full="/api/milestone-images/{{ img.id }}">
        <button type="button" class="mimg-del"
                hx-delete="/api/milestones/{{ m.id }}/images/{{ img.id }}"
                hx-target="#mimg-{{ m.id }}" hx-swap="innerHTML"
                hx-confirm="{{ t('confirm.image') }}"
                title="{{ t('delete') }}">&times;</button>
    </span>
    {% endfor %}
    <form class="mimg-upload" hx-post="/api/milestones/{{ m.id }}/images"
          hx-target="#mimg-{{ m.id }}" hx-swap="innerHTML"
          hx-encoding="multipart/form-data">
        <input type="file" id="mimg-file-{{ m.id }}" name="files"
               accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
    </form>
</div>
